name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20' # Specify your desired Node.js version
          cache: npm

      - name: Install rsvg-convert
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin

      - name: Install npm dependencies
        run: npm ci

      - name: Run build script
        run: bash build.sh -p b -d

      - name: Show build log on failure
        if: ${{ failure() }}
        run: cat build.log

      - name: Disable AppArmor for puppeteer
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Run tests
        run: bash scripts/runtests.sh -i -f 